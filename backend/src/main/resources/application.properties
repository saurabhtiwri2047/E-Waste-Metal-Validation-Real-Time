spring.application.name=ewaste-valuation

# =========================================================
# MySQL Database Configuration
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/ewaste_valuation?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================================================
# SQL Initialization
# =========================================================
spring.sql.init.mode=never

# =========================================================
# File Upload
# =========================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================================================
# Server
# =========================================================
server.port=8081

# =========================================================
# Logging
# =========================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.ewaste.valuation=DEBUG
